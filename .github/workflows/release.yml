name: release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  # Runs on every matching PR and on tag pushes: vet, test, and a full
  # cross-compile of the release matrix without publishing. Catches broken
  # builds and .goreleaser.yaml mistakes before a tag is ever cut.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false # release/build inputs must not come from a branch-writable cache
      - run: go vet ./...
      - run: go test ./... -short
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-dist
          path: dist/*
          retention-days: 7

  # Only on a version tag. Builds the matrix and publishes a GitHub Release
  # with archives and checksums.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false # release/build inputs must not come from a branch-writable cache
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
